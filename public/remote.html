<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Five Levels Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
  :root { --bg: #0b0d12; --panel: #141821; --line: #262c3b; --ink: #f4f5f8; --muted: #9aa3b5; --accent: #7c5cff; --live: #22d3a6; --warn: #ffb547; --danger: #ff5c8a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; font-weight: 900; letter-spacing: -.01em; }
  .chip { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border: 2px solid var(--muted); color: var(--muted); }
  .chip.ok { border-color: var(--live); color: var(--live); }
  .chip.bad { border-color: var(--danger); color: var(--danger); }
  .stats { margin-left: auto; font-size: 13px; color: var(--muted); }
  .card { background: var(--panel); border: 2px solid var(--line); padding: 16px; display: grid; gap: 10px; }
  .now { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .now .n { font: 700 16px "JetBrains Mono", monospace; color: var(--accent); }
  .now .t { font-size: 26px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
  .who { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .say { font-size: 17px; line-height: 1.45; color: #d5d9e3; border-left: 4px solid var(--warn); padding-left: 12px; }
  .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: var(--panel); border: 2px solid var(--line); min-height: 56px; padding: 10px 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 20px; min-height: 72px; }
  button.go { background: #10231f; border-color: var(--live); color: var(--live); }
  button.stop { background: #2a1520; border-color: var(--danger); color: var(--danger); }
  button[disabled] { opacity: .4; cursor: default; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .big { font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
  .kv { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .kv span { color: var(--muted); font-size: 13px; }
  .jumps { display: flex; flex-wrap: wrap; gap: 6px; }
  .jumps button { min-height: 40px; padding: 6px 10px; font-size: 13px; }
  .jumps button.on { border-color: var(--accent); color: #c9bcff; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); border: 2px solid var(--warn); padding: 10px 14px; font-weight: 700; max-width: calc(100% - 32px); }
  #keyForm { display: grid; gap: 8px; }
  #keyForm input { font: inherit; color: var(--ink); background: #0f1219; border: 2px solid var(--line); padding: 12px; }
  details summary { cursor: pointer; font-weight: 800; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Five Levels · Remote</h1>
    <span class="chip" id="conn">Connecting</span>
    <span class="stats" id="stats"></span>
  </div>

  <div class="card" id="keyCard" hidden>
    <div class="label">Presenter key needed</div>
    <form id="keyForm"><input id="keyInput" type="password" autocomplete="off" placeholder="Paste the presenter key"><button type="submit">Save key on this device</button></form>
  </div>

  <div class="card">
    <div class="now"><span class="n" id="stepN">–</span><span class="t" id="stepT">–</span></div>
    <div class="who" id="stepWho"></div>
    <div class="say" id="say"></div>
  </div>

  <div class="nav">
    <button id="prev">◀ Back</button>
    <button id="next" class="primary">Next ▶</button>
  </div>

  <div class="card" id="ctx"></div>

  <details class="card">
    <summary>Jump · Reset</summary>
    <div class="jumps" id="jumps"></div>
    <button id="reset" class="stop">Reset all (tap twice)</button>
  </details>
</div>
<div id="toast" hidden></div>

<script>
// Mirrors the deck's run of show (public/deck.html STEPS).
const STEPS = [
  ["Title", "s1", 1], ["L1 map", "s2", 1], ["L1 intro", "s3", 1], ["L1 power-ups", "s4", 1],
  ["Q1 commits", "q", 1, "commits"], ["Q1 reveal", "rv", 1, "commits"],
  ["L2 map", "s2", 2], ["L2 intro", "s3", 2], ["L2 power-ups", "s4", 2],
  ["L3 map", "s2", 3], ["L3 intro", "s3", 3], ["L3 power-ups", "s4", 3],
  ["Q2 Lead Center leads", "q", 3, "leads"], ["Q2 reveal", "rv", 3, "leads"], ["Client impact", "s9", 3],
  ["L4 map", "s2", 4], ["L4 intro", "s3", 4], ["L4 legendary", "s4", 4], ["AI Dev live", "ai", 4],
  ["Q3 AI DEV PRs", "q", 4, "aidev_prs"], ["Q3 reveal", "rv", 4, "aidev_prs"],
  ["L5 map", "s2", 5], ["L5 intro", "s3", 5], ["L5 power-ups", "s4", 5],
  ["Pain removed", "s8", 5], ["Quality Shield", "beat", 5], ["Boss fight", "beat", 5], ["Final", "s12", 6],
];
const WHO = { 1: "Taulant", 2: "Abenezer", 3: "Hikmat", 4: "Roma & Blin", 5: "Martin", 6: "Martin" };
const SAY = {
  0: "This year the Systems team shipped hundreds of features. Instead of slides, we made it a game. Scan the QR now: joining gets you 100 points and the first ten get a badge. Then do the two missions: tick the manual work you don't do anymore, and vote for your tool of the year.",
  1: "Five presenters, five levels. Every level unlocks power-ups: the tools we built. The bar at the bottom counts the manual tasks you just told us you retired.",
  2: "Level one: goodbye, spreadsheets.", 3: "Digital PR tracking, Brand Profiles, Review Removal and the Recipe Card agent replaced the sheets and docs we used to live in.",
  4: "First question: how many commits did Systems push this year? Closest guess wins up to 500 points. You have 30 seconds.",
  5: "Read the number and the podium out loud. The closest guess takes the Oracle badge.",
  6: "Level two: monitoring nobody has to do.", 7: "Abenezer takes over.", 8: "The GBP monitor checks every listing and an AI filter drops the noise. Backlink gaps and Query Fan-Out turn hours of research into a button.",
  9: "Level three: the client, in numbers.", 10: "Hikmat takes over.", 11: "Leads by channel, CRM leads, cost per lead and sentiment in one view, and the Lead Center Blin built, where every number clicks through to the leads.",
  12: "How many real leads does the Lead Center track? Guess on your phone.", 13: "Read the number. Thousands of them became signed clients, all traceable to the lead.",
  14: "This is where it shows up for clients: faster answers and faster fixes. The amber boxes are numbers we're still measuring.",
  15: "Level four is the legendary one.", 16: "Roma and Blin take over.", 17: "The one legendary drop this year: AI Dev. A Slack message goes in, a pull request comes out, and you pick the change.",
  18: "Vote now. [Close the vote] The room picked this one. Roma, send it. [Start] The clock is running. [Stop] Pull request open.",
  19: "Last question: how many pull requests did AI DEV open from September 9 to 27?", 20: "Read the number: across 136 client repos, in under three weeks. Anyone who answered all three gets Full Run.",
  21: "Level five: AI Writer and the boss fight.", 22: "Martin takes over.", 23: "AI Writer: drafts that know each client, checked against their Brand Profile before anyone sees them.",
  24: "Here's what you told us: this many manual tasks retired, and your tool of the year. We didn't give you free time. We took repetitive work off your plate so your time goes to work that matters.",
  25: "Speed is half the story. Each of these safeguards stops a mistake before it reaches a client. [Beat + for each one]",
  26: "The final boss: the legacy dashboard, untouched since 2023, whose Google Business charts showed random numbers. [Beat + four times] The last chunk is what's next.",
  27: "Top three, congratulations. Thanks for playing. Questions?",
};
const JUMPS = [["Title", 0], ["L1", 1], ["Q1", 4], ["L2", 6], ["L3", 9], ["Q2", 12], ["Client", 14], ["L4", 15], ["AI Dev", 18], ["Q3", 19], ["L5", 21], ["Pain", 24], ["Quality", 25], ["Boss", 26], ["Final", 27]];
const VOTE_LABELS = { a: 'A · "Free case review" button', b: "B · FAQ section", c: "C · Review stars in footer", d: "D · Click-to-call bar" };

const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const params = new URLSearchParams(location.search);
if (params.get("key")) { store.set("adminKey", params.get("key")); history.replaceState(null, "", location.pathname); }
let KEY = store.get("adminKey") || "";
let S = null;
let resetArmed = 0;
let lastControl = 0; // polls that started before the last button press are stale

function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }

async function control(action, extra = {}) {
  if (!KEY) { $("keyCard").hidden = false; toast("Add the presenter key first"); return; }
  try {
    const r = await fetch("/api/control", { method: "POST", headers: { "content-type": "application/json", "x-admin-key": KEY }, body: JSON.stringify({ action, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { $("keyCard").hidden = false; toast("Wrong presenter key"); return; }
    if (!r.ok) { toast(j.error || "That didn't work"); return; }
    lastControl = Date.now(); S = j; render();
  } catch (e) { toast("No connection. Try again."); }
}

const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

function button(label, cls, onClick, disabled) {
  const b = document.createElement("button");
  b.textContent = label; if (cls) b.className = cls; b.disabled = !!disabled;
  b.addEventListener("click", onClick);
  return b;
}

function render() {
  if (!S) return;
  const i = S.step || 0;
  const [label, kind, lv, qid] = STEPS[i] || STEPS[0];
  $("stepN").textContent = `${i + 1}/${STEPS.length}`;
  $("stepT").textContent = label;
  $("stepWho").textContent = `Level ${Math.min(lv, 5)} · ${WHO[lv]}`;
  $("say").textContent = SAY[i] || "";
  $("stats").textContent = `${S.players.length} players · ${fmt(S.hours.perWeek)} tasks · ${S.tools.total} tool votes`;
  $("prev").disabled = i <= 0;
  $("next").disabled = i >= STEPS.length - 1;

  const ctx = $("ctx");
  ctx.innerHTML = "";
  const title = (t) => { const d = document.createElement("div"); d.className = "label"; d.textContent = t; ctx.appendChild(d); };
  const row = (...btns) => { const d = document.createElement("div"); d.className = "row"; btns.forEach((b) => d.appendChild(b)); ctx.appendChild(d); };
  const kv = (pairs) => { const d = document.createElement("div"); d.className = "kv"; d.innerHTML = pairs.map(([k, v]) => `<div><span>${k}</span><div class="big">${v}</div></div>`).join(""); ctx.appendChild(d); };

  if (kind === "q" || kind === "rv") {
    const g = S.guesses[qid] || {};
    const open = S.guessOpen === qid;
    const revealed = g.actual != null;
    title(kind === "q" ? "Live question" : "Reveal");
    kv([["Answers in", fmt(g.count)], ["Room median", g.median == null ? "–" : fmt(g.median)], ["Status", revealed ? "Revealed" : open ? "Open" : g.count ? "Closed" : "Ready"]]);
    if (kind === "q") {
      row(button("Open question", "go", () => control("openQ", { id: qid }), open || revealed), button("Close", "stop", () => control("closeQ", { id: qid }), !open));
      // One tap to the reveal screen: move the deck on, then reveal.
      if (!open && (g.count || revealed)) row(button(revealed ? "Show the reveal ▶" : "Reveal ▶", "primary", async () => { await control("goto", { step: i + 1 }); if (!revealed) await control("revealQ", { id: qid }); }));
    }
    else row(button(revealed ? "Revealed" : "Reveal answer", "go", () => control("revealQ", { id: qid }), revealed), button("Close question", "stop", () => control("closeQ", { id: qid }), !open));
  } else if (kind === "ai") {
    const V = S.vote; const T = S.timer || {};
    const running = T.startedAt && !T.stoppedAt;
    title("AI Dev vote");
    const counts = Object.entries(V.counts).map(([k, n]) => `${VOTE_LABELS[k] || k}: ${n}`).join(" · ");
    kv([["Votes", fmt(V.total)], ["Vote", V.open ? "Open" : "Closed"]]);
    const c = document.createElement("div"); c.className = "kv"; c.innerHTML = `<span>${counts}</span>`; ctx.appendChild(c);
    row(button("Open vote", "go", () => control("openVote"), V.open), button("Close vote", "stop", () => control("closeVote"), !V.open));
    title("Stopwatch");
    const clock = document.createElement("div"); clock.className = "big"; clock.id = "clock"; ctx.appendChild(clock);
    row(button("Start", "go", () => control("startT"), running), button("Stop", "stop", () => control("stopT"), !running), button("Reset", "", () => control("resetT")));
  } else if (kind === "beat") {
    title(label === "Boss fight" ? "Boss hits (4)" : "Safeguards (8)");
    row(button("Beat +", "go", () => control("beat", { d: 1 })), button("Beat −", "", () => control("beat", { d: -1 })));
  } else {
    title("On screen");
    const top = Object.entries(S.tools.counts).sort((a, b) => b[1] - a[1])[0];
    kv([["Players", fmt(S.players.length)], ["Tasks retired", fmt(S.hours.perWeek)], ["Top tool votes", top && top[1] ? fmt(top[1]) : "–"]]);
  }

  $("jumps").innerHTML = "";
  for (const [l, n] of JUMPS) $("jumps").appendChild(button(l, n === i ? "on" : "", () => control("goto", { step: n })));
  tick();
}

function tick() {
  const el = document.getElementById("clock");
  if (!el || !S) return;
  const T = S.timer || {};
  el.textContent = T.startedAt ? mmss((T.stoppedAt || Date.now()) - T.startedAt) : "00:00";
}

async function poll() {
  try {
    const started = Date.now();
    const r = await fetch("/api/state", { cache: "no-store" });
    const j = await r.json();
    if (started < lastControl) return;
    S = j;
    $("conn").textContent = "Live"; $("conn").className = "chip ok";
    render();
  } catch (e) { $("conn").textContent = "Offline"; $("conn").className = "chip bad"; }
}

$("prev").addEventListener("click", () => S && control("goto", { step: Math.max(0, (S.step || 0) - 1) }));
$("next").addEventListener("click", () => S && control("goto", { step: Math.min(STEPS.length - 1, (S.step || 0) + 1) }));
$("reset").addEventListener("click", () => {
  if (Date.now() - resetArmed < 4000) { resetArmed = 0; $("reset").textContent = "Reset all (tap twice)"; control("reset"); toast("Game reset. The deck goes back to the title."); }
  else { resetArmed = Date.now(); $("reset").textContent = "Tap again to wipe the game"; setTimeout(() => { if (resetArmed) $("reset").textContent = "Reset all (tap twice)"; }, 4000); }
});
$("keyForm").addEventListener("submit", (e) => { e.preventDefault(); KEY = $("keyInput").value.trim(); store.set("adminKey", KEY); $("keyCard").hidden = !!KEY; toast("Key saved on this device"); });
if (!KEY) $("keyCard").hidden = false;
poll();
setInterval(poll, 1000);
setInterval(tick, 250);
</script>
</body>
</html>
