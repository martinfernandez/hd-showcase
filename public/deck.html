<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Levels</title>
</head>
<body>
<template id="tpl">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
html,body{margin:0;background:#05060a;color:#f4f5f8;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
a{color:#22d3a6}a:hover{color:#7c5cff}
button:focus-visible{outline:2px solid #7c5cff;outline-offset:2px}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes cf{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}}
@keyframes fadeOut{to{opacity:0;transform:scale(.96)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</helmet>
<div style="position:fixed;inset:0;background:#05060a;overflow:hidden">
<div style="position:absolute;left:50%;top:50%;width:1600px;height:900px;margin-left:-800px;margin-top:-450px;transform:scale({{ scale }});transform-origin:center;background:#0b0d12;overflow:hidden">

<sc-if value="{{ show.s1 }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="01 Title + QR" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:72px">
  <div style="display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;align-items:center;gap:16px"><div style="width:14px;height:14px;background:#7c5cff"></div><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Hennessey Digital · Systems</div></div>
    <div style="font-size:164px;font-weight:900;line-height:.9;letter-spacing:-.05em;margin-top:48px">Five levels.<br><span style="color:#7c5cff">One year.</span></div>
    <div style="font-size:34px;font-weight:500;color:#aab2c2;margin-top:32px;max-width:780px;line-height:1.3;text-wrap:pretty">What Systems built, the hours it gave back, and the mistakes it stopped. Play along on your phone.</div>
    <div style="margin-top:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid #232a38">
      <div style="padding:22px 16px 0 0"><div style="font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1">1,798</div><div style="font-size:20px;font-weight:600;color:#9aa3b5;margin-top:8px">commits</div></div>
      <div style="padding:22px 16px 0 0"><div style="font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1">1,240</div><div style="font-size:20px;font-weight:600;color:#9aa3b5;margin-top:8px">pull requests merged</div></div>
      <div style="padding:22px 16px 0 0"><div style="font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1">672</div><div style="font-size:20px;font-weight:600;color:#9aa3b5;margin-top:8px">features</div></div>
      <div style="padding:22px 16px 0 0"><div style="font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1">35</div><div style="font-size:20px;font-weight:600;color:#9aa3b5;margin-top:8px">backend apps</div></div>
      <div style="padding:22px 16px 0 0"><div style="font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1;color:#22d3a6">1</div><div style="font-size:20px;font-weight:600;color:#9aa3b5;margin-top:8px">AI bot teammate</div></div>
    </div>
  </div>
  <div style="background:#141821;border:2px solid #232a38;padding:28px;display:flex;flex-direction:column;gap:20px;align-self:start">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:22px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Scan to join</div><div style="background:#ffb547;color:#0b0d12;font-size:20px;font-weight:900;padding:4px 10px">+100</div></div>
    <div style="background:#ffffff;padding:18px;width:100%;box-sizing:border-box;aspect-ratio:1/1"><img src="{{ qrSrc }}" alt="Join QR" style="width:100%;height:100%;display:block;image-rendering:pixelated"></div>
    <div style="font-size:20px;font-weight:600;color:#9aa3b5;word-break:break-all;line-height:1.3">{{ joinUrlShort }}</div>
    <div style="border-top:2px solid #232a38;padding-top:18px;display:flex;align-items:baseline;gap:14px"><div style="font-size:88px;font-weight:900;line-height:1;letter-spacing:-.04em">{{ hud.players }}</div><div style="font-size:24px;font-weight:700;color:#9aa3b5">players in</div></div>
    <div style="font-size:20px;font-weight:700;color:#ffb547">{{ earlyText }}</div>
  </div>
</div>
</sc-if>

<sc-if value="{{ show.s2 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="02 Level map" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Level map</div><div style="margin-left:auto;font-size:22px;font-weight:800;color:#9aa3b5">Level {{ level }} of 5</div></div>
  <div style="font-size:88px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:36px">Five presenters. Five levels.</div>
  <div style="flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;margin-top:40px;min-height:0">
    <sc-for list="{{ levels }}" as="lv" hint-placeholder-count="5">
      <div style="background:{{ lv.bg }};border:2px solid {{ lv.border }};opacity:{{ lv.op }};box-shadow:{{ lv.glow }};display:flex;flex-direction:column;padding:24px;box-sizing:border-box;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:{{ lv.chipBg }};color:{{ lv.chipInk }};padding:6px 10px">{{ lv.chip }}</div><div style="font-size:34px;font-weight:900;color:#22d3a6">{{ lv.mark }}</div></div>
        <div style="font-size:150px;font-weight:900;line-height:.85;letter-spacing:-.06em;margin-top:28px">{{ lv.num }}</div>
        <div style="margin-top:auto;font-size:24px;font-weight:700;color:{{ lv.sub }}">{{ lv.who }}</div>
        <div style="font-size:32px;font-weight:800;line-height:1.08;margin-top:8px;letter-spacing:-.02em;text-wrap:pretty">{{ lv.title }}</div>
        <div style="font-size:20px;font-weight:700;color:{{ lv.sub }};margin-top:18px;padding-top:14px;border-top:2px solid {{ lv.rule }}">{{ lv.pu }}</div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<sc-if value="{{ show.s3 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="03 Level intro" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:grid;grid-template-columns:600px minmax(0,1fr);gap:64px">
  <div style="display:flex;flex-direction:column;justify-content:space-between;border-right:2px solid #232a38;padding-right:48px;min-width:0">
    <div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Level</div>
    <div style="font-size:440px;font-weight:900;line-height:.78;letter-spacing:-.07em;color:#7c5cff">{{ intro.num }}</div>
    <div style="font-size:22px;font-weight:700;color:#9aa3b5">{{ intro.of }}</div>
  </div>
  <div style="display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;align-items:center;gap:18px"><div style="width:64px;height:64px;background:#141821;border:2px solid #7c5cff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900">{{ intro.initial }}</div><div style="font-size:36px;font-weight:800">{{ intro.who }}</div></div>
    <div style="font-size:108px;font-weight:900;line-height:.95;letter-spacing:-.045em;margin-top:36px;text-wrap:balance">{{ intro.title }}</div>
    <div style="margin-top:auto">
      <div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5;margin-bottom:14px">Power-ups unlocked</div>
      <div style="display:flex;flex-direction:column;border-top:2px solid #232a38">
        <sc-for list="{{ intro.cards }}" as="c" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:18px;padding:13px 0;border-bottom:2px solid #232a38"><div style="width:18px;height:18px;background:{{ c.color }};flex:none"></div><div style="font-size:32px;font-weight:800;flex:1;min-width:0">{{ c.name }}</div><div style="font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:{{ c.color }}">{{ c.rarityLabel }}</div></div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ show.s4 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="04 Power-up cards" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Level {{ level }} · Power-ups</div><div style="margin-left:auto;font-size:22px;font-weight:800;color:#9aa3b5">{{ pu.count }}</div></div>
  <sc-if value="{{ pu.multi }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;gap:20px;margin-top:40px;min-height:0">
      <sc-for list="{{ pu.cards }}" as="c" hint-placeholder-count="4">
        <div style="flex:1;min-width:0;background:#141821;border:2px solid {{ c.color }};box-shadow:{{ c.glow }};display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;padding:14px 20px;background:{{ c.band }};color:{{ c.bandInk }};font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase"><span>{{ c.rarityLabel }}</span><span>LV {{ c.lv }}</span></div>
          <div style="padding:26px 24px;display:flex;flex-direction:column;gap:16px;flex:1">
            <div style="font-size:18px;font-weight:700;color:#9aa3b5">{{ c.no }}</div>
            <div style="font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance">{{ c.name }}</div>
            <div style="font-size:24px;font-weight:500;line-height:1.3;color:#c9cfdb;text-wrap:pretty">{{ c.effect }}</div>
            <div style="margin-top:auto;border-top:2px solid #232a38;padding-top:16px;font-size:20px;font-weight:600;color:#9aa3b5">Built by <b style="color:#f4f5f8">{{ c.who }}</b></div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ pu.single }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:grid;grid-template-columns:520px minmax(0,1fr);gap:72px;margin-top:40px;min-height:0">
      <sc-for list="{{ pu.cards }}" as="c" hint-placeholder-count="1">
        <div style="background:#141821;border:2px solid {{ c.color }};box-shadow:{{ c.glow }};display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;padding:18px 24px;background:{{ c.band }};color:{{ c.bandInk }};font-size:22px;font-weight:900;letter-spacing:.16em;text-transform:uppercase"><span>{{ c.rarityLabel }}</span><span>LV {{ c.lv }}</span></div>
          <div style="padding:32px;display:flex;flex-direction:column;gap:20px;flex:1">
            <div style="font-size:20px;font-weight:700;color:#9aa3b5">{{ c.no }}</div>
            <div style="font-size:88px;font-weight:900;line-height:.95;letter-spacing:-.04em">{{ c.name }}</div>
            <div style="font-size:28px;font-weight:500;line-height:1.35;color:#c9cfdb;text-wrap:pretty">{{ c.effect }}</div>
            <div style="margin-top:auto;border-top:2px solid #232a38;padding-top:18px;font-size:22px;font-weight:600;color:#9aa3b5">Built by <b style="color:#f4f5f8">{{ c.who }}</b></div>
          </div>
        </div>
      </sc-for>
      <div style="display:flex;flex-direction:column;justify-content:center;min-width:0">
        <div style="font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffb547">The one legendary drop this year</div>
        <div style="font-size:120px;font-weight:900;line-height:.92;letter-spacing:-.05em;margin-top:24px">Built live.<br>On a stopwatch.</div>
        <div style="font-size:32px;font-weight:500;color:#aab2c2;margin-top:32px;line-height:1.35;max-width:640px">Slack message in. Pull request out. You pick the change.</div>
      </div>
    </div>
  </sc-if>
</div>
</sc-if>

<sc-if value="{{ show.s5 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="05 Live question" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Live question</div><div style="font-size:18px;font-weight:900;background:#ffb547;color:#0b0d12;padding:4px 10px">GUESS · 0–500 PTS</div><div style="margin-left:auto;font-size:22px;font-weight:800;color:#9aa3b5">Question {{ q.num }} of 3</div></div>
  <div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:64px;margin-top:40px;min-height:0">
    <div style="display:flex;flex-direction:column;min-width:0">
      <div style="font-size:88px;font-weight:900;line-height:1;letter-spacing:-.04em;text-wrap:balance">{{ q.text }}</div>
      <div style="margin-top:auto;display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #232a38">
        <div style="padding-top:20px"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">Answers in</div><div style="font-size:136px;font-weight:900;line-height:1;letter-spacing:-.05em;margin-top:8px">{{ q.answers }}</div></div>
        <div style="padding:20px 0 0 32px;border-left:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">Room median</div><div style="font-size:136px;font-weight:900;line-height:1;letter-spacing:-.05em;margin-top:8px;color:#22d3a6">{{ q.median }}</div></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
      <div style="position:relative;width:400px;height:400px;border-radius:50%;background:conic-gradient({{ q.ringColor }} {{ q.ringDeg }}deg, #1c2230 0)">
        <div style="position:absolute;inset:22px;border-radius:50%;background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:150px;font-weight:900;line-height:1;letter-spacing:-.05em">{{ q.secs }}</div><div style="font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5;margin-top:6px">{{ q.ringLabel }}</div></div>
      </div>
      <div style="font-size:26px;font-weight:800;color:{{ q.statusColor }}">{{ q.status }}</div>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ show.s6 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="06 Reveal + podium" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">The reveal</div><div style="margin-left:auto;font-size:22px;font-weight:800;color:#9aa3b5">{{ q.short }}</div></div>
  <div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:64px;margin-top:36px;min-height:0">
    <div style="display:flex;flex-direction:column;min-width:0">
      <div style="font-size:34px;font-weight:700;color:#aab2c2;line-height:1.25;text-wrap:balance">{{ q.text }}</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6;margin-top:auto">Real answer</div>
      <div style="font-size:280px;font-weight:900;line-height:.9;letter-spacing:-.06em;color:#22d3a6;margin-top:8px">{{ rv.actual }}</div>
      <div style="display:flex;border-top:2px solid #232a38;margin-top:28px">
        <div style="padding-top:18px;flex:1"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">Room median</div><div style="font-size:64px;font-weight:900;line-height:1.1">{{ q.median }}</div></div>
        <div style="padding:18px 0 0 28px;flex:1;border-left:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">Room was off by</div><div style="font-size:64px;font-weight:900;line-height:1.1;color:#ffb547">{{ rv.off }}</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end">
      <sc-for list="{{ rv.podium }}" as="p" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;min-width:0">
          <div style="font-size:18px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#7c5cff;min-height:24px">{{ p.tag }}</div>
          <div style="width:72px;height:72px;background:{{ p.avColor }};color:#0b0d12;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;margin-top:8px">{{ p.glyph }}</div>
          <div style="font-size:30px;font-weight:800;margin-top:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</div>
          <div style="font-size:22px;font-weight:600;color:#9aa3b5">{{ p.line }}</div>
          <div style="font-size:28px;font-weight:900;color:#ffb547;margin-top:4px;min-height:34px">{{ p.pts }}</div>
          <div style="height:{{ p.h }}px;background:{{ p.bg }};border:2px solid {{ p.border }};margin-top:14px;padding:16px;box-sizing:border-box"><div style="font-size:96px;font-weight:900;line-height:.9;color:{{ p.rankInk }}">{{ p.rank }}</div></div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ show.s7 }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="07 AI Dev vote + stopwatch" style="position:absolute;left:0;top:0;width:1600px;height:824px;padding:52px 72px 40px;box-sizing:border-box;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid #232a38"><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#22d3a6">Level 4 · AI Dev</div><div style="font-size:18px;font-weight:900;background:#ffb547;color:#0b0d12;padding:4px 10px">LEGENDARY</div><div style="margin-left:auto;display:flex;align-items:center;gap:12px"><div style="width:14px;height:14px;background:{{ ai.statusColor }}"></div><div style="font-size:22px;font-weight:800;color:{{ ai.statusColor }};text-transform:uppercase;letter-spacing:.1em">{{ ai.status }}</div></div></div>
  <sc-if value="{{ ai.phaseVote }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;margin-top:32px;min-height:0">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px"><div style="font-size:84px;font-weight:900;letter-spacing:-.04em;line-height:1">What should the AI build?</div><div style="flex:none"><div style="font-size:96px;font-weight:900;line-height:1;letter-spacing:-.04em">{{ ai.total }}</div><div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">votes</div></div></div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:space-around;margin-top:24px;border-top:2px solid #232a38">
        <sc-for list="{{ ai.bars }}" as="b" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:84px minmax(0,1fr) 170px;gap:24px;align-items:center">
            <div style="width:84px;height:84px;background:{{ b.color }};color:#0b0d12;font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center">{{ b.k }}</div>
            <div style="min-width:0"><div style="font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.label }}</div><div style="height:22px;background:#1c2230;margin-top:12px"><div style="height:100%;width:{{ b.w }}%;background:{{ b.color }};transition:width .6s cubic-bezier(.2,.8,.2,1)"></div></div></div>
            <div style="font-size:72px;font-weight:900;letter-spacing:-.03em">{{ b.pct }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ ai.phaseClock }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;margin-top:32px;min-height:0">
      <div style="font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#9aa3b5">The room picked</div>
